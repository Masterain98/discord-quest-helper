name: Build test packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  build:
    name: Build ${{ matrix.name }} test packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            cdp_target: x86_64-pc-windows-msvc
            args: --bundles msi
          - name: macOS ARM64
            platform: macos-15
            cdp_target: aarch64-apple-darwin
            args: --no-sign --target aarch64-apple-darwin --bundles app,dmg
          - name: Linux x64
            platform: ubuntu-22.04
            cdp_target: x86_64-unknown-linux-gnu
            args: --bundles deb,appimage

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read build version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < public/version.txt)"
          if [[ -z "$version" ]]; then
            echo "::error::public/version.txt is empty"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libnss3 \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            binutils \
            squashfs-tools \
            python3 \
            xdg-utils \
            desktop-file-utils \
            libfuse2

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Validate Linux static ELF audit
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          node scripts/check-linux-bundle-inputs.mjs
          python3 scripts/test_audit_linux_elf.py
          node --test scripts/audit-packaged-identity.test.mjs

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync build version
        run: pnpm run sync-version

      - name: Build frontend
        run: pnpm run build

      - name: Build runner sidecar
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.cdp_target }}
        run: pnpm run build:runner

      - name: Build Discord CDP launcher sidecar
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.cdp_target }}
        run: pnpm run build:cdp-launcher

      - name: Build Tauri packages
        run: pnpm exec tauri build ${{ matrix.args }} -- --locked

      - name: Stage Windows portable package
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          CDP_TARGET: ${{ matrix.cdp_target }}
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $portableDir = 'build/windows-portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item 'target/release/discord-quest-helper.exe' "$portableDir/discord-quest-helper.exe"
          Copy-Item "src-tauri/binaries/waybridge-$env:CDP_TARGET.exe" "$portableDir/waybridge.exe"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "build/discord-quest-helper-Windows-x64-$env:BUILD_VERSION-portable.zip" -Force

      - name: Stage macOS app bundle with permissions
        if: matrix.platform == 'macos-15'
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          app_dir='target/aarch64-apple-darwin/release/bundle/macos'
          app_bundle="$(find "$app_dir" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_bundle" ]]; then
            echo "::error::No macOS app bundle found in $app_dir"
            exit 1
          fi
          mkdir -p build
          tar -czf "build/discord-quest-helper-macos-arm64-$BUILD_VERSION-app.tar.gz" \
            -C "$app_dir" "$(basename "$app_bundle")"

      - name: Stage Linux AppImage with permissions
        if: matrix.platform == 'ubuntu-22.04'
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          appimage_dir='target/release/bundle/appimage'
          appimage="$(find "$appimage_dir" -mindepth 1 -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$appimage" ]]; then
            echo "::error::No AppImage found in $appimage_dir"
            exit 1
          fi
          node scripts/audit-packaged-identity.mjs \
            --platform linux --artifact "$appimage" \
            --output target/release/bundle/identity-manifest-linux-appimage.json
          deb="$(find target/release/bundle/deb -mindepth 1 -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          node scripts/audit-packaged-identity.mjs \
            --platform linux --artifact "$deb" \
            --output target/release/bundle/identity-manifest-linux-deb.json
          mkdir -p build
          tar -czf "build/discord-quest-helper-linux-x64-$BUILD_VERSION.AppImage.tar.gz" \
            -C "$appimage_dir" "$(basename "$appimage")"

      - name: Upload Windows portable package
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: test-windows-portable-${{ steps.version.outputs.value }}-${{ github.run_id }}
          path: build/discord-quest-helper-Windows-x64-${{ steps.version.outputs.value }}-portable.zip
          if-no-files-found: error

      - name: Upload Windows MSI installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: test-windows-msi-${{ steps.version.outputs.value }}-${{ github.run_id }}
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload macOS ARM64 packages
        if: matrix.platform == 'macos-15'
        uses: actions/upload-artifact@v7
        with:
          name: test-macos-arm64-${{ steps.version.outputs.value }}-${{ github.run_id }}
          path: |
            build/discord-quest-helper-macos-arm64-${{ steps.version.outputs.value }}-app.tar.gz
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Linux x64 packages
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: test-linux-x64-${{ steps.version.outputs.value }}-${{ github.run_id }}
          path: |
            target/release/bundle/identity-manifest-linux-*.json
            build/*-provenance.json
            target/release/bundle/deb/*.deb
            build/discord-quest-helper-linux-x64-${{ steps.version.outputs.value }}.AppImage.tar.gz
          if-no-files-found: error
