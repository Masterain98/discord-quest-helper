name: CI

# Continuous integration checks for every pull request and develop push.
# Release bundling stays in build-release.yml.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

# Superseded PR updates / develop pushes cancel their in-flight run instead of
# queueing another full 3-platform build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            cdp_target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-14' # Apple Silicon
            cdp_target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            cdp_target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      # Tauri 2 build dependencies for Debian/Ubuntu (WebKitGTK 4.1 baseline).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils \
            xvfb \
            xdotool \
            x11-utils \
            weston \
            dbus-x11 \
            libfuse2

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate i18n
        run: pnpm run i18n:check

      - name: Run frontend tests
        run: pnpm test

      - name: Validate runtime identity policy and audit tools
        run: |
          pnpm run check:runtime-identity
          pnpm run test:identity-audit
          pnpm run test:packaged-identity

      # `tauri::generate_context!` resolves `frontendDist` (../dist) at compile
      # time, so the bundle has to exist before any cargo step touches src-tauri.
      - name: Build frontend
        run: pnpm run build

      - name: Rust format
        run: |
          cargo fmt --package discord-cdp-launch-core --package discord-cdp-launcher -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Verify CDP core dependency boundary
        run: pnpm run check:cdp-core-deps

      - name: Build runner sidecar
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.cdp_target }}
        run: pnpm run build:runner

      - name: Build Discord CDP launcher sidecar
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.cdp_target }}
        run: pnpm run build:cdp-launcher

      - name: Build Linux DEB and AppImage identity smoke artifacts
        if: matrix.platform == 'ubuntu-22.04'
        run: pnpm exec tauri build --bundles deb,appimage

      - name: Audit and smoke-test Linux desktop identities
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          deb="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f | head -n 1)"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -type f | head -n 1)"
          test -n "$deb"
          test -n "$appimage"
          node scripts/audit-packaged-identity.mjs \
            --platform linux --artifact "$deb" \
            --output target/release/bundle/identity-manifest-linux-deb.json
          node scripts/audit-packaged-identity.mjs \
            --platform linux --artifact "$appimage" \
            --output target/release/bundle/identity-manifest-linux-appimage.json
          mkdir -p "$RUNNER_TEMP/deb-root"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb-root"
          binary="$RUNNER_TEMP/deb-root/usr/bin/meridian"
          dbus-run-session -- xvfb-run -a scripts/smoke-linux-runtime-identity.sh \
            x11 --kind binary "$binary" \
            target/release/bundle/identity-smoke-linux-deb-x11.json
          dbus-run-session -- scripts/smoke-linux-runtime-identity.sh \
            wayland --kind binary "$binary" \
            target/release/bundle/identity-smoke-linux-deb-wayland.json
          dbus-run-session -- xvfb-run -a scripts/smoke-linux-runtime-identity.sh \
            x11 --kind appimage "$appimage" \
            target/release/bundle/identity-smoke-linux-appimage-x11.json
          dbus-run-session -- scripts/smoke-linux-runtime-identity.sh \
            wayland --kind appimage "$appimage" \
            target/release/bundle/identity-smoke-linux-appimage-wayland.json

      - name: Build ad-hoc macOS app and DMG identity smoke artifacts
        if: matrix.platform == 'macos-14'
        run: pnpm exec tauri build --target ${{ matrix.cdp_target }} --bundles app,dmg

      - name: Sign, audit, and smoke-test macOS bundle
        if: matrix.platform == 'macos-14'
        shell: bash
        run: |
          app="$(find target/${{ matrix.cdp_target }}/release/bundle/macos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$app"
          scripts/sign-macos-bundle-smoke.sh "$app"
          scripts/verify-macos-bundle.sh "$app"
          node scripts/audit-packaged-identity.mjs \
            --platform macos --artifact "$app" --allow-unsigned \
            --output target/${{ matrix.cdp_target }}/release/bundle/identity-manifest-macos-smoke.json
          scripts/smoke-macos-runtime-identity.sh "$app" \
            target/${{ matrix.cdp_target }}/release/bundle/identity-smoke-macos.json

      - name: Upload desktop identity manifests
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'macos-14'
        uses: actions/upload-artifact@v7
        with:
          name: runtime-identity-${{ matrix.cdp_target }}
          path: |
            target/**/bundle/identity-*.json
